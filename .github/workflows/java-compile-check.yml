name: Java Compile Check

on:
  push:
    branches:
      - '*-learning'
  pull_request:
    branches:
      - '*-learning'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: false

jobs:
  compile-java:
    name: Compile Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and compile Java files
        run: |
          echo "🔍 Searching for Java files..."
          JAVA_FILES=$(find . -name "*.java" -not -path "./.git/*" | head -100)

          if [ -z "$JAVA_FILES" ]; then
            echo "⚠️ No Java files found. Nothing to compile."
            exit 0
          fi

          echo "📄 Found Java files:"
          echo "$JAVA_FILES"
          echo ""

          echo "🔨 Compiling..."
          COMPILE_FAILED=0

          # Compile all Java files together so they can reference each other
          FILELIST=$(find . -name "*.java" -not -path "./.git/*")
          javac -d /tmp/classes $FILELIST 2>&1 || COMPILE_FAILED=1

          if [ $COMPILE_FAILED -eq 1 ]; then
            echo ""
            echo "❌ COMPILATION FAILED"
            echo "═══════════════════════════════════════════════════"
            echo "Your code has errors. Fix them and push again."
            echo "═══════════════════════════════════════════════════"
            exit 1
          else
            echo ""
            echo "✅ COMPILATION SUCCESSFUL"
            echo "═══════════════════════════════════════════════════"
            echo "All Java files compiled without errors. Great job!"
            echo "═══════════════════════════════════════════════════"
          fi
