name: Java Compile Check

on:
  push:
    branches:
      - '*-learning'
  pull_request:
    branches:
      - '*-learning'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check'
        required: false

jobs:
  compile-java:
    name: Compile Java
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PAT || github.token }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and compile Java files
        id: compile
        run: |
          echo "🔍 Searching for Java files..."
          JAVA_FILES=$(find exercises/ -name "*.java" -not -path "./.git/*" 2>/dev/null | sort)

          if [ -z "$JAVA_FILES" ]; then
            echo "⚠️ No Java files found. Nothing to compile."
            echo "compile_result=none" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "📄 Found Java files:"
          echo "$JAVA_FILES"
          echo ""

          mkdir -p /tmp/classes
          PASSED=0
          FAILED=0
          ERRORS_OUTPUT=""
          FIRST_FAILING_FILE=""

          while IFS= read -r f; do
            echo "🔨 Compiling $f..."
            if javac -d /tmp/classes "$f" 2>/tmp/single_error.txt; then
              echo "  ✅ $f — OK"
              PASSED=$((PASSED + 1))
            else
              echo "  ❌ $f — FAILED"
              FILE_ERRORS=$(cat /tmp/single_error.txt)
              ERRORS_OUTPUT="$ERRORS_OUTPUT
          ### \`$(basename $f)\`
          \`\`\`
          $FILE_ERRORS
          \`\`\`
          "
              if [ -z "$FIRST_FAILING_FILE" ]; then
                FIRST_FAILING_FILE="$f"
              fi
              FAILED=$((FAILED + 1))
            fi
          done <<< "$JAVA_FILES"

          TOTAL=$((PASSED + FAILED))

          echo ""
          echo "══════════════════════════════════════════════"
          echo "📊 RESULTS: $PASSED/$TOTAL passed"
          echo "══════════════════════════════════════════════"

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "first_failing_file=$FIRST_FAILING_FILE" >> $GITHUB_OUTPUT

          # Write combined errors to file for README
          echo "$ERRORS_OUTPUT" > /tmp/compile_errors.txt

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ COMPILATION FAILED — $FAILED file(s) have errors."
            echo "compile_result=failure" >> $GITHUB_OUTPUT
            exit 1
          else
            echo ""
            echo "✅ ALL FILES COMPILED — Great job!"
            echo "compile_result=success" >> $GITHUB_OUTPUT
          fi

      - name: Generate Learning Branch README
        if: always() && github.event_name == 'push'
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          RAW_NAME=$(echo "$BRANCH" | sed 's/-learning//')
          STUDENT_NAME="$(echo "${RAW_NAME:0:1}" | tr '[:lower:]' '[:upper:]')${RAW_NAME:1}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMPILE_RESULT="${{ steps.compile.outputs.compile_result }}"
          PASSED="${{ steps.compile.outputs.passed }}"
          FAILED="${{ steps.compile.outputs.failed }}"
          TOTAL="${{ steps.compile.outputs.total }}"
          FIRST_FAILING_FILE="${{ steps.compile.outputs.first_failing_file }}"

          echo "📝 Generating README for $STUDENT_NAME on $BRANCH..."
          echo "   Result: $COMPILE_RESULT ($PASSED/$TOTAL passed)"

          # ── Detect first-time student (no commits from student, only bot commits) ──
          STUDENT_COMMITS=$(git log --oneline --author="Exercise Bot" --invert-grep 2>/dev/null | grep -v "^$" | wc -l | tr -d ' ')
          IS_FIRST_TIME=false
          if [ "$STUDENT_COMMITS" -eq 0 ]; then
            IS_FIRST_TIME=true
          fi

          # ── Build STATUS section ──
          if [ "$IS_FIRST_TIME" = true ] && [ "$COMPILE_RESULT" != "success" ]; then
            STATUS_SECTION=$(cat <<WELCOMEEOF
          ## 👋 Welcome to Your Learning Branch, ${STUDENT_NAME}!

          > 🎉 **Jan set this branch up just for you!**
          >
          > This is where you'll receive exercises, solve them, and submit them via Pull Request.
          > The badge above will turn **green** when your code compiles correctly.
          >
          > **Don't know where to start?** Check the "How to Solve Exercises" section below!
          WELCOMEEOF
          )
          elif [ "$COMPILE_RESULT" == "success" ]; then
            STATUS_SECTION=$(cat <<SUCCESSEOF
          ## ✅ Great Job, ${STUDENT_NAME}! All Exercises Compile!

          > 🎉 **I'm so proud of you!** **${PASSED}/${TOTAL}** file(s) compiled with zero errors.
          >
          > Every green badge means you're one step closer to mastering programming.
          > Keep up the amazing work — you're doing great!

          \`\`\`
          ✅ COMPILATION SUCCESSFUL — ${PASSED}/${TOTAL} passed
          ═══════════════════════════════════════════════════
          All Java files compiled without errors. Great job!
          ═══════════════════════════════════════════════════
          \`\`\`
          SUCCESSEOF
          )
          elif [ "$COMPILE_RESULT" == "failure" ]; then
            ERRORS=$(cat /tmp/compile_errors.txt 2>/dev/null || echo "Compile error occurred. Check the Actions tab for details.")

            # Build github.dev deep link to first failing file
            DEVLINK=""
            if [ -n "$FIRST_FAILING_FILE" ]; then
              # Strip leading ./ if present
              CLEAN_PATH=$(echo "$FIRST_FAILING_FILE" | sed 's|^\./||')
              DEVLINK="
          > 🔗 **[Open the failing file in github.dev](https://github.dev/Rust-Frog/Teaching-My-Peers-Github-and-Git/blob/${BRANCH}/${CLEAN_PATH})** — fix it right in your browser!"
            fi

            STATUS_SECTION=$(cat <<FAILEOF
          ## ❌ Compilation Errors — ${FAILED}/${TOTAL} File(s) Failed

          Don't worry — **errors are how we learn!** Here's what went wrong:

          $ERRORS
          $DEVLINK

          > 💪 **You got this!** Fix the errors above, commit, and push again.
          > The badge will turn green when your code compiles.
          >
          > **Stuck?** Ask Jan for help — that's what a trainer is for!
          FAILEOF
          )
          else
            STATUS_SECTION=$(cat <<'NONEEOF'
          ## 📭 No Exercises Yet

          > Hang tight! Jan hasn't pushed any exercises to your branch yet.
          > When a new exercise arrives, you'll see it in the `exercises/` folder.
          NONEEOF
          )
          fi

          # ── Build exercise table with per-file status ──
          EXERCISE_TABLE="| # | Folder | File | Status |"
          EXERCISE_TABLE="$EXERCISE_TABLE
          |:--|:-------|:-----|:------:|"

          COUNT=0
          if [ -d "exercises" ]; then
            while IFS= read -r f; do
              COUNT=$((COUNT + 1))
              FILENAME=$(basename "$f")
              DIRNAME=$(dirname "$f" | sed 's|^\./||')
              # Check per-file pass/fail
              if javac -d /tmp/classes "$f" 2>/dev/null; then
                FILE_STATUS="✅"
              else
                FILE_STATUS="❌"
              fi
              FILE_LINK="[${FILENAME}](https://github.com/Rust-Frog/Teaching-My-Peers-Github-and-Git/blob/${BRANCH}/${DIRNAME}/${FILENAME})"
              EXERCISE_TABLE="$EXERCISE_TABLE
          | $COUNT | \`$DIRNAME\` | $FILE_LINK | $FILE_STATUS |"
            done < <(find exercises/ -name "*.java" -not -path "./.git/*" 2>/dev/null | sort)
          fi

          EXERCISE_SUMMARY=""
          PROGRESS_BAR=""
          if [ $COUNT -gt 0 ]; then
            EXERCISE_SUMMARY="**${PASSED}/${TOTAL} exercises compiling**"

            # Build 10-slot unicode progress bar
            FILLED=0
            if [ $TOTAL -gt 0 ]; then
              FILLED=$(( (PASSED * 10 + TOTAL - 1) / TOTAL ))  # ceiling division
            fi
            EMPTY=$((10 - FILLED))
            BAR=""
            for i in $(seq 1 $FILLED); do BAR="${BAR}█"; done
            for i in $(seq 1 $EMPTY);  do BAR="${BAR}░"; done
            if [ $PASSED -eq $TOTAL ] && [ $TOTAL -gt 0 ]; then
              PROGRESS_BAR="\`${BAR}\` **${PASSED}/${TOTAL}** 🎉 All passing!"
            else
              PROGRESS_BAR="\`${BAR}\` **${PASSED}/${TOTAL}** exercises passing"
            fi
          fi

          if [ $COUNT -eq 0 ]; then
            EXERCISE_TABLE="*No exercises found yet. They'll appear here when Jan pushes them!*"
          fi

          # ── Check template ──
          TEMPLATE=".github/templates/LEARNING_README.md"
          if [ ! -f "$TEMPLATE" ]; then
            echo "⚠️ Template not found at $TEMPLATE, skipping README generation"
            exit 0
          fi

          # ── Generate README via Python ──
          python3 << PYEOF
          with open("$TEMPLATE", "r") as f:
              template = f.read()

          status_section = """$STATUS_SECTION"""
          exercise_table = """$EXERCISE_TABLE"""
          exercise_summary = """$EXERCISE_SUMMARY"""
          progress_bar = """$PROGRESS_BAR"""

          readme = template
          readme = readme.replace("{{STUDENT_NAME}}", "$STUDENT_NAME")
          readme = readme.replace("{{BRANCH_NAME}}", "$BRANCH")
          readme = readme.replace("{{TIMESTAMP}}", "$TIMESTAMP")
          readme = readme.replace("{{STATUS_SECTION}}", status_section.strip())
          readme = readme.replace("{{EXERCISE_TABLE}}", exercise_table.strip())
          readme = readme.replace("{{EXERCISE_SUMMARY}}", exercise_summary.strip())
          readme = readme.replace("{{PROGRESS_BAR}}", progress_bar.strip())

          with open("README.md", "w") as f:
              f.write(readme)

          print("✅ README.md generated successfully")
          PYEOF

      - name: Push updated README
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "Exercise Bot"
          git config user.email "bot@github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "📝 README unchanged, nothing to push"
          else
            git commit -m "📊 Update README with build status [skip ci]"
            git push
            echo "✅ README pushed successfully"
          fi
